object_store:
  endpoint: https://s3.example.invalid
  region: us-east-1
  bucket: caller-owned-marketdata
  prefix: elmd-014
  path_style: true
  credential_ref: ELMD014_S3_CREDENTIALS
catalog:
  dsn_ref: ELMD014_POSTGRES_DSN
  min_conns: 1
  max_conns: 2
  server_majors:
    - 17
sources:
  - id: 7d1e8644-35af-5fd7-b0ba-3bf1b59ac6fc
    api: binance-spot
    endpoints:
      - https://data-api.binance.vision
      - wss://data-stream.binance.vision/ws
    methods:
      - market-data:http-get
      - market-data:websocket
    channels:
      - trade
      - depth@100ms
      - bookTicker
      - ticker
    families:
      - book
      - quote
      - ticker
      - trade
    symbols:
      - BNBBTC
verify:
  mode: live
  spool_root: ../verify/binance-spot/runtime/spool
  artifact_root: ../verify/binance-spot/runtime/artifacts
  max_messages: 64
  max_bytes: 4194304
  max_duration: 10s
  depth_limit: 100
